<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DexFingerGuessing · 灵巧手控制台</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#12141a; color:#e6e8ee; transition: background .15s;
         font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  body.flash { background:#17351f; }
  .wrap { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  .view { flex:1; min-width:0; }
  .view img { width:100%; border-radius:10px; background:#000; display:block; }
  .panel { width:340px; background:#1a1d26; border-radius:12px; padding:16px; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; }
  .sub { font-size:12px; color:#6b7280; margin-bottom:14px; }
  .row { margin-bottom:12px; }
  label { display:block; font-size:12px; color:#8b93a7; margin-bottom:6px; }
  select, button { width:100%; padding:10px; border-radius:8px; border:1px solid #2b3142;
                   background:#232838; color:#e6e8ee; font-size:14px; }
  button.go { background:#1f6feb; border-color:#1f6feb; font-weight:600; }
  button.stop { background:#3a2130; border-color:#5a2b3f; color:#ff8fae; }
  button.reset { background:#2f2a1c; border-color:#5c4d24; color:#ffd166; }
  button:disabled { opacity:.45; }
  .stat { font-size:12px; color:#8b93a7; line-height:1.9; }
  .stat b { color:#e6e8ee; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .score { font-size:22px; font-weight:700; text-align:center; padding:6px 0; }
  hr { border:0; border-top:1px solid #262b38; margin:14px 0; }
  .quiz { background:#151823; border-radius:10px; padding:12px; }
  .qhead { display:flex; justify-content:space-between; font-size:12px; color:#8b93a7; }
  .target { font-size:30px; font-weight:700; text-align:center; padding:8px 0; color:#ffd166; }
  .now { font-size:13px; text-align:center; color:#8b93a7; padding-bottom:6px; }
  .now b { color:#31c48d; }
  .sense { margin-top:12px; }
  .sense .t { font-size:11px; color:#8b93a7; margin:8px 0 4px; }
  .bars { display:flex; gap:2px; height:52px; align-items:flex-end; }
  .bars i { flex:1; background:#31c48d; min-height:1px; border-radius:1px 1px 0 0;
            transition: height .08s linear; }
  .bars.cur i { background:#5b9cf5; }
  canvas.chart { width:100%; height:96px; display:block; background:#0e1017;
                 border-radius:6px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="view"><img id="v" src="/stream" alt="实时画面"></div>
  <div class="panel">
    <h1>DexFingerGuessing</h1>
    <div class="sub">PaXini DexH13 · 灵巧手互动游乐场</div>

    <div class="row">
      <label>玩法</label>
      <select id="mode">
        <option value="preview">预览（只看不动）</option>
        <option value="mimic">跟随模仿</option>
        <option value="rps">猜拳</option>
        <option value="vr">VR 遥操作</option>
      </select>
    </div>
    <div class="row">
      <a href="/xr" style="display:block;text-align:center;padding:10px;border-radius:8px;background:#2b1a3a;border:1px solid #5a2b7f;color:#d9a6ff;text-decoration:none;font-size:13px">🎮 头显页面：/xr（点这里打开）</a>
    </div>
    <div class="row"><button id="go" class="go">开始</button></div>
    <div class="row"><button id="stop" class="stop">停止</button></div>
    <div class="row"><button id="reset" class="reset">复位到零位</button></div>
    <div class="row" style="display:flex;gap:8px">
      <button id="gclose" class="go" style="background:#1f6feb">闭合</button>
      <button id="gopen" class="stop" style="background:#232838;color:#e6e8ee">张开</button>
    </div>
    <div class="row" style="display:flex;gap:8px">
      <button id="grasp" class="go" style="background:#8a5a00">力控抓握</button>
      <button id="rec" class="reset" style="flex:1">开始录制</button>
    </div>
    <div class="row"><div class="score" id="score">0 : 0</div></div>

    <hr>

    <div class="quiz">
      <div class="qhead"><span>手势挑战（无需灵巧手）</span><span id="qt">30s</span></div>
      <div class="target" id="tgt">—</div>
      <div class="now">你出的：<b id="cur">—</b> · 得分 <b id="qs">0</b></div>
      <button id="qstart" class="go" style="margin-top:8px">开始挑战</button>
    </div>

    <hr>
    <div class="sense">
      <div class="t">触觉（固件 1.4.4 开放通道）</div>
      <div class="bars" id="tacbars"></div>
      <canvas class="chart" id="tacchart" width="600" height="192"></canvas>
      <div class="t">电流 mA</div>
      <div class="bars cur" id="curbars"></div>
      <canvas class="chart" id="curchart" width="600" height="192"></canvas>
    </div>
    <hr>
    <div class="stat" id="st">连接中…</div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const ZH = {rock:'石头', paper:'布', scissors:'剪刀'};
const HANDS = ['rock','paper','scissors'];

// ---------- 状态轮询 ----------
async function poll(){
  try{
    const s = await (await fetch('/api/status')).json();
    const hd = s.hand ? '#31c48d' : '#f05252';
    $('#st').innerHTML =
      '<div><span class="dot" style="background:'+hd+'"></span>手：<b>'+(s.hand?'已检测':'未检测')+'</b></div>' +
      '<div>手势：<b>'+(s.gesture?ZH[s.gesture]:'-')+'</b></div>' +
      '<div>帧率：<b>'+s.fps+'</b> FPS</div>' +
      '<div>状态：<b>'+(s.active?'运行中':'待机')+'</b> / '+s.mode+'</div>' +
      '<div>灵巧手：<b>'+(s.hand_ok?'在线':'离线')+'</b></div>' +
      '<div style="margin-top:6px;color:#6b7280">'+(s.message||'')+'</div>';
    $('#score').textContent = s.score.me + ' : ' + s.score.bot + '  (平 ' + s.score.draw + ')';
    $('#go').disabled = s.active;
    $('#stop').disabled = !s.active;
  }catch(e){ $('#st').textContent = '连接断开'; }
}
setInterval(poll, 500); poll();

// ---------- 触觉 / 电流 ----------
const TAC_N = 17, CUR_N = 13;
function mkBars(el, n){ el.innerHTML = ''; for(let i=0;i<n;i++) el.appendChild(document.createElement('i')); }
mkBars($('#tacbars'), TAC_N); mkBars($('#curbars'), CUR_N);

function drawBars(el, vals, floor){
  if(!vals || !vals.length) return;
  const kids = el.children;
  const mx = Math.max(floor || 100, ...vals.map(v => Math.abs(v)));
  for(let i=0;i<kids.length && i<vals.length;i++){
    const p = Math.min(1, Math.abs(vals[i]) / mx);
    kids[i].style.height = (2 + p * 48) + 'px';
    kids[i].style.opacity = 0.25 + 0.75 * p;
  }
}

// ---------- 波形 ----------
const HIST = 150;
const tacHist = [], curHist = [];
const TAC_COLORS = ['#31c48d','#ffd166','#ff8fae','#7dd3fc','#c084fc'];

function pushHist(hist, vals){ hist.push(vals.slice()); if(hist.length > HIST) hist.shift(); }

function drawChart(cv, hist, colors, floor){
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0,0,W,H);
  if(!hist.length) return;
  const n = Math.max(...hist.map(a => a.length));
  let mx = floor;
  for(const row of hist) for(const v of row) mx = Math.max(mx, Math.abs(v));
  ctx.strokeStyle = '#1e2430'; ctx.lineWidth = 1;
  for(let g=1; g<4; g++){ const y = H*g/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for(let i=0;i<n;i++){
    ctx.beginPath();
    ctx.strokeStyle = colors[i % colors.length];
    ctx.lineWidth = 3;
    hist.forEach((row, k) => {
      const x = W * k / Math.max(1, HIST-1);
      const v = Math.abs(row[i] || 0) / mx;
      const y = H - v * (H - 6) - 3;
      k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
}

async function sense(){
  try{
    const s = await (await fetch('/api/quick')).json();
    const tac = s.tactile || [], cur = s.current || [];
    drawBars($('#tacbars'), tac, 400);
    drawBars($('#curbars'), cur, 80);
    if(tac.length){ pushHist(tacHist, tac); drawChart($('#tacchart'), tacHist, TAC_COLORS, 600); }
    if(cur.length){ pushHist(curHist, cur); drawChart($('#curchart'), curHist, ['#5b9cf5'], 200); }
  }catch(e){}
  setTimeout(sense, 140);
}
sense();

$('#go').onclick = async () => {
  await fetch('/api/start', {method:'POST', headers:{'Content-Type':'application/json'},
                             body: JSON.stringify({mode: $('#mode').value})});
  poll();
};
$('#stop').onclick = async () => { await fetch('/api/stop', {method:'POST'}); poll(); };
$('#reset').onclick = async () => { await fetch('/api/reset', {method:'POST'}); poll(); };
$('#gclose').onclick = () => fetch('/api/gripper', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({close:true})});
$('#gopen').onclick  = () => fetch('/api/gripper', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({close:false})});

// ---------- 手势小游戏 ----------
let qOn = false, qScore = 0, qLeft = 30, qTarget = null, qTick = null, qTimer = null;

function newTarget(){
  qTarget = HANDS[Math.floor(Math.random()*3)];
  $('#tgt').textContent = ZH[qTarget];
}

async function tick(){
  if(!qOn) return;
  try{
    const s = await (await fetch('/api/quick')).json();
    $('#cur').textContent = s.gesture ? ZH[s.gesture] : '—';
    if(s.gesture && s.gesture === qTarget){
      qScore++; $('#qs').textContent = qScore;
      document.body.classList.add('flash');
      setTimeout(()=>document.body.classList.remove('flash'), 180);
      newTarget();
      await new Promise(r=>setTimeout(r, 500));   // 防止连加
    }
  }catch(e){}
  if(qOn) setTimeout(tick, 90);
}

$('#qstart').onclick = () => {
  if(qOn) return;
  qOn = true; qScore = 0; qLeft = 30;
  $('#qs').textContent = 0; $('#qt').textContent = '30s';
  $('#qstart').disabled = true; $('#qstart').textContent = '挑战中…';
  newTarget(); tick();
  qTimer = setInterval(()=>{
    qLeft--; $('#qt').textContent = qLeft + 's';
    if(qLeft <= 0){
      qOn = false; clearInterval(qTimer);
      $('#qstart').disabled = false; $('#qstart').textContent = '再来一次';
      $('#tgt').textContent = '得分 ' + qScore;
    }
  }, 1000);
};
$('#grasp').onclick = async () => {
  const b = $('#grasp');
  b.disabled = true; b.textContent = '抓握中…';
  try { await fetch('/api/grasp', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}); }
  catch(e){}
  setTimeout(()=>{ b.disabled = false; b.textContent = '力控抓握'; }, 12000);
};

let recOn = false;
$('#rec').onclick = async () => {
  const b = $('#rec');
  b.disabled = true;
  try {
    const r = await fetch(recOn ? '/api/record/stop' : '/api/record/start',
                          {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    const d = await r.json();
    recOn = !recOn;
    b.textContent = recOn ? '停止录制' : '开始录制';
    b.style.background = recOn ? '#8a1c1c' : '';
    if(d.dir) $('#tgt').textContent = (recOn ? '录制中 ' : '已保存 ') + d.dir.split('/').pop();
  } catch(e){}
  b.disabled = false;
};
</script>
</body>
</html>
